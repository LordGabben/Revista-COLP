<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 800' width='800' height='800'>
  <defs>
    <!-- Triangle Gradient -->
    <linearGradient id='triGrad' x1='0.5' y1='0' x2='0.5' y2='1'>
      <stop offset='0%' stop-color='#008ee6'/>
      <stop offset='35%' stop-color='#6bc3f5'/>
      <stop offset='75%' stop-color='#cbe9fc'/>
      <stop offset='100%' stop-color='#f3f9fe'/>
    </linearGradient>

    <!-- Blue Disc Gradient -->
    <radialGradient id='blueDiscGrad' cx='50%' cy='45%' r='50%'>
      <stop offset='0%' stop-color='#008fe7'/>
      <stop offset='100%' stop-color='#006fb8'/>
    </radialGradient>

    <!-- Arc for Text: curved along top red band -->
    <path id='textArc' d='M 130,420 A 285,285 0 1,1 670,420' fill='none' />
  </defs>

  <!-- 1. OUTER TRANSPARENT BACKGROUND (No white boxes, perfectly clean) -->

  <!-- 2. TOP RED ARC (Circumference 380px radius) -->
  <path d='M 744,400 A 380,380 0 1,0 56,400 L 163,400 A 260,260 0 1,1 637,400 Z' fill='#E51B24' stroke='#111' stroke-width='3' />

  <!-- 3. LOWER TRICOLOR BANDS (Bolivian Colors) -->
  <!-- Green Outer Band -->
  <path d='M 56,400 A 380,380 0 0,0 744,400 L 706,400 A 340,340 0 0,1 94,400 Z' fill='#007934' stroke='#111' stroke-width='2' />

  <!-- Red Middle Band -->
  <path d='M 94,400 A 340,340 0 0,0 706,400 L 671,400 A 300,300 0 0,1 129,400 Z' fill='#E51B24' stroke='#111' stroke-width='2' />

  <!-- Yellow Inner Band with Stars -->
  <path d='M 129,400 A 300,300 0 0,0 671,400 L 637,400 A 260,260 0 0,1 163,400 Z' fill='#FDE100' stroke='#111' stroke-width='2' />

  <!-- 4. 9 BLACK FIVE-POINTED STARS ON LOWER YELLOW BAND -->
  <polygon points='620.4,554.3 627.9,556.3 632.6,550.1 633.0,557.9 640.4,560.4 633.0,563.2 632.9,571.0 628.0,564.9 620.6,567.2 624.9,560.7' fill='#111111' />
  <polygon points='576.5,603.0 583.3,606.8 589.4,601.9 587.8,609.6 594.4,613.8 586.6,614.7 584.7,622.3 581.4,615.2 573.6,615.6 579.3,610.3' fill='#111111' />
  <polygon points='522.1,639.7 527.8,645.0 534.9,641.7 531.6,648.8 536.9,654.5 529.2,653.5 525.4,660.3 523.9,652.7 516.3,651.2 523.1,647.4' fill='#111111' />
  <polygon points='465.1,661.0 469.4,667.5 477.1,665.9 472.2,672.0 476.2,678.8 468.8,676.0 463.6,681.9 463.9,674.1 456.8,670.9 464.3,668.8' fill='#111111' />
  <polygon points='400.0,669.0 402.6,676.4 410.5,676.6 404.3,681.4 406.5,688.9 400.0,684.5 393.5,688.9 395.7,681.4 389.5,676.6 397.4,676.4' fill='#111111' />
  <polygon points='334.9,661.0 335.7,668.8 343.2,670.9 336.1,674.1 336.4,681.9 331.2,676.0 323.8,678.8 327.8,672.0 322.9,665.9 330.6,667.5' fill='#111111' />
  <polygon points='277.9,639.7 276.9,647.4 283.7,651.2 276.1,652.7 274.6,660.3 270.8,653.5 263.1,654.5 268.4,648.8 265.1,641.7 272.2,645.0' fill='#111111' />
  <polygon points='223.5,603.0 220.7,610.3 226.4,615.6 218.6,615.2 215.3,622.3 213.4,614.7 205.6,613.8 212.2,609.6 210.6,601.9 216.7,606.8' fill='#111111' />
  <polygon points='179.6,554.3 175.1,560.7 179.4,567.2 172.0,564.9 167.1,571.0 167.0,563.2 159.6,560.4 167.0,557.9 167.4,550.1 172.1,556.3' fill='#111111' />

  <!-- 5. BOLD BLACK CAPITAL TEXT ON TOP RED ARC -->
  <text font-family='Arial Black, Impact, Montserrat, sans-serif' font-weight='900' font-size='38' fill='#000000' letter-spacing='3.5'>
    <textPath href='#textArc' startOffset='50%' text-anchor='middle'>
      COLEGIO DE ODONTOLOGOS DE LA PAZ
    </textPath>
  </text>

  <!-- 6. INNER BLUE DISC -->
  <circle cx='400' cy='400' r='256' fill='url(#blueDiscGrad)' stroke='#FFFFFF' stroke-width='6' />
  <circle cx='400' cy='400' r='259' fill='none' stroke='#111111' stroke-width='2' />

  <!-- 7. WHITE SQUARE OUTLINE IN CENTER -->
  <rect x='250' y='250' width='300' height='300' fill='none' stroke='#FFFFFF' stroke-width='7' />

  <!-- 8. WHITE TRIANGLE WITH SKY BLUE GRADIENT -->
  <polygon points='400,180 205,492 595,492' fill='url(#triGrad)' stroke='#FFFFFF' stroke-width='7' stroke-linejoin='round' />

  <!-- 9. WINGS AND CADUCEUS (White with crisp blue lineart) -->
  <g fill='#FFFFFF' stroke='#006cb8' stroke-width='1.5' stroke-linejoin='round'>
    <!-- Left Wing -->
    <path d='M 390,320 C 340,290 290,295 240,315 C 265,328 295,335 325,338 C 285,342 260,355 245,365 C 275,368 310,368 340,362 C 300,370 280,385 270,395 C 305,392 345,385 385,370 Z' />
    <!-- Right Wing -->
    <path d='M 410,320 C 460,290 510,295 560,315 C 535,328 505,335 475,338 C 515,342 540,355 555,365 C 525,368 490,368 460,362 C 500,370 520,385 530,395 C 495,392 455,385 415,370 Z' />
  </g>

  <!-- Staff / Rod -->
  <circle cx='400' cy='290' r='18' fill='#FFFFFF' stroke='#006cb8' stroke-width='2' />
  <rect x='393' y='295' width='14' height='240' rx='5' fill='#FFFFFF' stroke='#006cb8' stroke-width='2' />
  <polygon points='393,535 407,535 400,555' fill='#FFFFFF' stroke='#006cb8' stroke-width='2' />

  <!-- Entwined Serpent Body in Figure 8 (White with blue contours) -->
  <g fill='none' stroke='#FFFFFF' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'>
    <path d='M 350,370 C 350,335 450,345 450,390 C 450,435 350,425 350,470 C 350,505 440,500 420,530' />
    <path d='M 450,370 C 450,335 350,345 350,390 C 350,435 450,425 450,470 C 450,505 360,500 380,530' />
  </g>
  <g fill='none' stroke='#006cb8' stroke-width='2'>
    <path d='M 350,370 C 350,335 450,345 450,390 C 450,435 350,425 350,470 C 350,505 440,500 420,530' />
    <path d='M 450,370 C 450,335 350,345 350,390 C 350,435 450,425 450,470 C 450,505 360,500 380,530' />
  </g>

  <!-- Outer Black Trim Circle -->
  <circle cx='400' cy='400' r='380' fill='none' stroke='#111111' stroke-width='4' />
</svg>